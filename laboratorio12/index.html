<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>laboratorio 12</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <form id="registroForm" action="procesar.php" method="POST">
        <fieldset>
            <legend>Datos Personales</legend>

            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" name="nombre" placeholder="nombre" required>

            <label for="email">Correo Electronico:</label>
            <input type="email" id="email" name="email" placeholder="email" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="contraseña" required>

            <label for="lenguaje">Lenguaje Favorito:</label>
            <select id="lenguaje" name="lenguaje">
                <option value="HTML">HTML</option>
                <option value="JS">JavaScript</option>
                <option value="Python">Python</option>
            </select>

            <label for="motivacion">Motivacion:</label>
            <textarea id="motivacion" name="motivacion" maxlength="200"
                placeholder="Cual es tu motivacion para inscribirte?"></textarea>

            <button type="submit" id="btnEnviar">Enviar Inscripcion</button>
        </fieldset>
    </form>

    <script src="script.js"></script>
</body>

</html>
